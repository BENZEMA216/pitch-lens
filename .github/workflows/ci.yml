name: ci

# Lightweight gate: lint + compile + pure unit tests.
# Deliberately does NOT `pip install -r requirements.txt` — torch/funasr pull multi-GB
# models. transcribe.py imports engine deps lazily, so tests run on a bare runner.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tools
        run: pip install pytest ruff
      - name: Lint (syntax errors + undefined names / unused imports)
        run: ruff check --select E9,F scripts/ tests/
      - name: Compile-check
        run: python -m compileall -q scripts/
      - name: Shellcheck setup.sh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && shellcheck scripts/setup.sh || true
      - name: Unit tests
        run: python -m pytest tests -q
